# Upstream GNU Wget release this port is built from.
UPSTREAM_NAME=wget
UPSTREAM_VERSION=1.25.0
UPSTREAM_URL=https://ftp.gnu.org/gnu/wget/wget-1.25.0.tar.gz
UPSTREAM_SHA256=766e48423e79359ea31e41db9e5c289675947a7fcf2efdcedb726ac9d0da3784
# Darshit Shah's release signing key (keys/wget-signing-key.asc, from
# keys.openpgp.org).  It expired on 2025-11-10; 1.25.0 was signed on
# 2024-11-10, while it was valid, so gpg reports EXPKEYSIG with a VALIDSIG.
UPSTREAM_GPG_KEY=7845120B07CBD8D6ECE5FF2B2A1743EDA91A35B6
# Our patch level on top of the upstream release (1.25.0-vms2)
VMS_PATCH_LEVEL=2
# Libraries built by sibling projects on each node, in the same work directory
# (<workdir>.<TREE>.INSTALL_<arch>]: INCLUDE, LIB):
#   zlib  (github.com/issinoho/vms-zlib)  for compressed transfers, ZLIB$ROOT
#   PCRE2 (github.com/issinoho/vms-pcre2) for --regex-type=pcre, PCRE2$ROOT
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
PCRE2_VERSION=10.49
PCRE2_TREE=PCRE2-10_49
# TLS: VSI's SSL3 kit (OpenSSL 3.0); its shared images are a prerequisite.
SSL_KIT=SSL3
# Default CA certificates shipped in the kit: Mozilla's root store as extracted
# by curl.se (https://curl.se/docs/caextract.html), as in vms-curl.
CA_BUNDLE_URL=https://curl.se/ca/cacert-2026-09-25.pem
CA_BUNDLE_SHA256=a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
